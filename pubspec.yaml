name: recipe_app
description: "A complete Flutter Recipe App built with Provider and Firebase Firestore, featuring dynamic ingredient scaling, category filtering, favorites persistence, and dark mode."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Firebase Backend
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4

  # UI and Styling
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_rating_bar: ^4.0.1
  font_awesome_flutter: ^10.7.0
  cupertino_icons: ^1.0.8
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Assets section
  assets:
    - assets/images/
    - assets/icons/
